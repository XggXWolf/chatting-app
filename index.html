<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Chatting App</title>
</head>

<body>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" defer></script>

    <script src="client.js" defer></script>

    <div class="page-content">
        <div id="testcolor1" class="chat-container">
            <div class="chat-box">
                <div class="messages">
                    <!-- Messages will be appended here -->
                </div>
                <div class="input-box">
                    <img src="images/blank-profile-picture-973460_960_720.webp" alt="user-profile" class="profile-pic-small">
                    <input type="text" class="message-input" placeholder="Type a message..." id="messageInput">
                    <button class="send-btn" id="send-button">Send</button>
                </div>
            </div>
        </div>
    </div>

    <div class="join-overlay">
        <div class="join-popup">    
            <h3 class="login-text">Log in</h3>

            <div class="profile-pic-container">
                <img src="images/blank-profile-picture-973460_960_720.webp" alt="user-profile" class="profile-pic">
                <button class="edit-btn">✎</button>
            </div>

            <input type="text" class="username" placeholder="Enter your username">
            <button class="join-btn">Join</button>
        </div>
    </div>

</body>

</html>
